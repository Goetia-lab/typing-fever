<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1425">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23ffd75e'/%3E%3C/svg%3E">
<title>Typing Fever</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scanlines"></div>
  <div id="vignette"></div>
  <div id="flash"></div>
  <div id="bigfever">FEVER!!</div>
  <div class="wrap">
    <div class="topbar">
      <div class="stat">WPM<span id="wpm">0</span></div>
      <div class="stat">KATA<span id="words">0</span></div>
      <div class="stat">STREAK<span id="streak">0</span></div>
      <div class="stat">BEST<span id="best">0</span></div>
      <div class="stat">HARI<span id="day">0</span></div>
<button id="sound" class="soundbtn" type="button" aria-pressed="true">SUARA</button>
    </div>
    <div id="graphwrap">
      <canvas id="wpmGraph" width="100" height="24"></canvas>
      <div id="session">sesi: 0 kata · 0 mnt</div>
    </div>
    <div class="feverbar">
      <div id="feverfill"></div>
      <span id="feverlabel">FEVER</span>
    </div>
    <div id="pools"></div>
    <div id="stage">
      <div id="banner" class="hidden">FEVER!!</div>
<div id="word" role="status" aria-live="polite"></div>
      <div id="fx"></div>
      <div id="combo"></div>
      <div id="hint">ketik kata-nya &middot; salah nggak apa-apa<br>bar penuh = FEVER: spam SPACE, kata auto kelar</div>
    </div>
    <div id="vn">
      <canvas id="cat" width="32" height="32"></canvas>
      <div id="vnbox">
        <div id="vnname">KOKI</div>
        <div id="vntext"></div>
      </div>
    </div>
<input id="ghost" aria-label="Ketik kata" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  </div>

  <script src="words.js"></script>
  <script src="config.js"></script>
  <script src="sprites.js"></script>

<script src="game.js"></script>
</body>
</html>
