<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typing Fever</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #1a1425;
    color: #e8dff5;
    font-family: 'Press Start 2P', monospace;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    transition: background 1s;
  }
  body.fever { background: #2b1220; }

  .scanlines {
    position: fixed; inset: 0; pointer-events: none; z-index: 50;
    background: repeating-linear-gradient(
      to bottom, rgba(0,0,0,.18) 0 2px, transparent 2px 4px
    );
  }

  .wrap {
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 22px; padding: 20px;
  }

  .topbar { display: flex; gap: 26px; flex-wrap: wrap; justify-content: center; }
  .stat { font-size: 10px; color: #8f80b0; letter-spacing: 1px; }
  .stat span { color: #ffd75e; display: block; margin-top: 6px; font-size: 14px; }

  .feverbar {
    position: relative; width: min(520px, 90vw); height: 22px;
    background: #241b38;
    border: 4px solid #4a3a6b;
    box-shadow: inset 0 0 0 2px #1a1425, 0 0 0 2px #4a3a6b;
  }
  #feverfill {
    height: 100%; width: 0%;
    background: repeating-linear-gradient(90deg, #ff9d5c 0 8px, #ff5b8b 8px 16px);
    transition: width .18s cubic-bezier(.25,.8,.3,1);
  }
  body.fever #feverfill { animation: feverflash .4s ease-in-out infinite, shimmer 1.2s linear infinite; }
  @keyframes shimmer { to { background-position: 32px 0; } }
  @keyframes feverflash { 50% { filter: brightness(1.6); } }
  #feverlabel {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: #fff; text-shadow: 2px 2px 0 #000;
    letter-spacing: 2px; pointer-events: none;
  }

  #stage {
    position: relative;
    width: min(680px, 92vw); min-height: 190px;
    background: #221a33;
    border: 4px solid #4a3a6b;
    box-shadow: inset 0 0 0 2px #1a1425, 6px 6px 0 #0d0a16;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 26px; padding: 30px 20px;
  }

  #banner {
    position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%);
    font-size: 22px; color: #ffd75e;
    text-shadow: 3px 3px 0 #b03060, 6px 6px 0 #000;
    animation: pulse .6s ease-in-out infinite;
    white-space: nowrap;
  }
  #banner.hidden { display: none; }
  @keyframes pulse { 50% { transform: translateX(-50%) scale(1.12); } }

  #word { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; }
  .ch {
    font-size: clamp(20px, 5.5vw, 40px);
    color: #5d4e7d;
    transition: color .05s;
  }
  .ch.done { color: #8be08b; }
  .ch.wrong { color: #ff5b5b; animation: shake .18s cubic-bezier(.36,.07,.19,.97); }
  .ch.cur { border-right: 5px solid #ffd75e; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { border-color: transparent; } }
  @keyframes shake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(3px); }
    30%, 50%, 70% { transform: translateX(-4px) rotate(-1deg); }
    40%, 60% { transform: translateX(4px) rotate(1deg); }
  }

  #word.autopop { animation: pop .3s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop { 0% { transform: scale(.5); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }

  /* --- meriah pass: smooth 60fps, transform + opacity only --- */
  #fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .ch.enter { animation: chIn .28s cubic-bezier(.2,.9,.25,1) both; will-change: transform, opacity; }
  .ch.pop { animation: charPop .22s cubic-bezier(.34,1.56,.64,1); }
  @keyframes chIn { 0% { transform: translateY(14px) scale(.9); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
  @keyframes charPop { 0% { transform: scale(1); } 40% { transform: scale(1.45); } 100% { transform: scale(1); } }
  #stage.wrongflash { animation: wrongflash .3s ease-out; }
  @keyframes wrongflash {
    0% { box-shadow: inset 0 0 0 2px #ff5b5b, 0 0 0 rgba(255,91,91,0); }
    30% { box-shadow: inset 0 0 0 2px #ff5b5b, 0 0 32px rgba(255,91,91,.8); }
    100% { box-shadow: inset 0 0 0 2px #1a1425, 6px 6px 0 #0d0a16; }
  }
  #stage.feverin { animation: feverin .5s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes feverin {
    0% { transform: scale(.9); filter: brightness(2.2) saturate(1.4); }
    60% { transform: scale(1.05); filter: brightness(1.3) saturate(1.2); }
    100% { transform: scale(1); filter: brightness(1); }
  }
  #banner.in { animation: bannerIn .4s cubic-bezier(.34,1.56,.64,1), pulse .6s ease-in-out .4s infinite; }
  @keyframes bannerIn { 0% { transform: translateX(-50%) scale(0) rotate(-6deg); } 100% { transform: translateX(-50%) scale(1) rotate(0); } }
  #banner.out { animation: bannerOut .3s cubic-bezier(.5,0,.75,0) forwards; }
  @keyframes bannerOut { to { transform: translateX(-50%) scale(0) rotate(6deg); opacity: 0; } }
  .particle { position: absolute; width: 7px; height: 7px; animation: particle .65s cubic-bezier(.17,.67,.35,1) forwards; will-change: transform, opacity; }
  @keyframes particle {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    70% { opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; }
  }
  .floater { position: absolute; font-size: 16px; color: #8be08b; text-shadow: 2px 2px 0 #000, 0 0 12px rgba(139,224,139,.5); animation: floatUp .8s cubic-bezier(.2,.7,.3,1) forwards; will-change: transform, opacity; }
  .floater.big { font-size: 24px; color: #ffd75e; text-shadow: 2px 2px 0 #b03060, 0 0 16px rgba(255,215,94,.6); }
  @keyframes floatUp {
    0% { transform: translateY(0) scale(.8); opacity: 0; }
    15% { transform: translateY(-8px) scale(1.1); opacity: 1; }
    100% { transform: translateY(-64px) scale(1); opacity: 0; }
  }
  .stat span.bump { animation: bump .3s cubic-bezier(.34,1.56,.64,1); }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.5); } 100% { transform: scale(1); } }
  body.fever .scanlines { background: repeating-linear-gradient(to bottom, rgba(255,80,120,.10) 0 2px, transparent 2px 4px); }

  /* --- megah fever --- */
  #flash { position: fixed; inset: 0; background: #ffd75e; opacity: 0; pointer-events: none; z-index: 40; }
  #flash.go { animation: flash .5s ease-out; }
  @keyframes flash { 0% { opacity: 0; } 15% { opacity: .85; } 100% { opacity: 0; } }
  #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 30; opacity: 0; transition: opacity .4s ease;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(255,40,80,.38) 100%); }
  body.fever #vignette { opacity: 1; }
  #bigfever { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 60;
    font-size: 64px; color: #ffd75e; letter-spacing: 4px;
    text-shadow: 4px 4px 0 #b03060, 8px 8px 0 #000, 0 0 40px rgba(255,215,94,.8); opacity: 0; }
  #bigfever.go { animation: bigIn .9s cubic-bezier(.2,.9,.3,1.2) forwards; }
  @keyframes bigIn { 0% { transform: scale(0) rotate(-8deg); opacity: 0; } 25% { transform: scale(1.25) rotate(2deg); opacity: 1; }
    70% { transform: scale(1.1) rotate(0); opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }
  .wrap.shake { animation: stageShake .45s cubic-bezier(.36,.07,.19,.97); }
  @keyframes stageShake {
    10%, 90% { transform: translateX(-3px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-6px) rotate(-.4deg); }
    40%, 60% { transform: translateX(6px) rotate(.4deg); }
  }
  #combo { font-size: 14px; color: #ffd75e; text-shadow: 2px 2px 0 #b03060; opacity: 0; transition: opacity .25s ease; min-height: 20px; }
  body.fever #combo { opacity: 1; }
  #combo.bump { animation: bump .25s cubic-bezier(.34,1.56,.64,1); }
  body.fever .feverbar { box-shadow: inset 0 0 0 2px #1a1425, 0 0 24px rgba(255,120,150,.8); }
  body.fever #word.autopop { animation: pop .3s cubic-bezier(.34,1.56,.64,1), wob .4s ease .1s; }
  @keyframes wob { 25% { transform: rotate(2deg); } 75% { transform: rotate(-2deg); } }
  .particle.rain { animation: rain .9s linear forwards; }
  @keyframes rain { 0% { transform: translateY(-10px) scale(1); opacity: 1; } 100% { transform: translateY(220px) scale(.6); opacity: 0; } }

  #hint { font-size: 10px; color: #a795c9; line-height: 1.8; text-align: center; }
  body.fever #hint { color: #ff9d5c; }

  #pools { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .poolbtn { font-family: inherit; font-size: 8px; padding: 6px 8px; cursor: pointer; color: #8f80b0; background: #241b38; border: 3px solid #4a3a6b; }
  .poolbtn.active { color: #1a1425; background: #ffd75e; border-color: #ffd75e; }
  .poolbtn:hover { border-color: #ffd75e; }

  #graphwrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #wpmGraph { width: 240px; height: 58px; image-rendering: pixelated; background: #241b38; border: 3px solid #4a3a6b; }
  #session { font-size: 8px; color: #8f80b0; letter-spacing: 1px; }

  body.scene-siang { background: #241b38; }
  body.scene-senja { background: #2b1a2e; }
  body.scene-malam { background: #120e1c; }

  #vn { display: flex; gap: 12px; align-items: flex-end; width: min(680px, 92vw); }
  #cat { width: 64px; height: 64px; image-rendering: pixelated; flex-shrink: 0; }
  #vnbox { flex: 1; background: #221a33; border: 4px solid #4a3a6b; box-shadow: inset 0 0 0 2px #1a1425; padding: 10px 12px; min-height: 64px; }
  #vnname { font-size: 9px; color: #ffd75e; margin-bottom: 6px; letter-spacing: 2px; }
  #vntext { font-size: 10px; color: #e8dff5; line-height: 1.7; min-height: 34px; }

  #ghost {
    position: fixed; top: -9999px; left: -9999px;
    opacity: 0; border: none; width: 1px; height: 1px;
  }
</style>
</head>
<body>
  <div class="scanlines"></div>
  <div id="vignette"></div>
  <div id="flash"></div>
  <div id="bigfever">FEVER!!</div>
  <div class="wrap">
    <div class="topbar">
      <div class="stat">WPM<span id="wpm">0</span></div>
      <div class="stat">KATA<span id="words">0</span></div>
      <div class="stat">STREAK<span id="streak">0</span></div>
      <div class="stat">BEST<span id="best">0</span></div>
      <div class="stat">HARI<span id="day">0</span></div>
    </div>
    <div id="graphwrap">
      <canvas id="wpmGraph" width="100" height="24"></canvas>
      <div id="session">sesi: 0 kata · 0 mnt</div>
    </div>
    <div class="feverbar">
      <div id="feverfill"></div>
      <span id="feverlabel">FEVER</span>
    </div>
    <div id="pools"></div>
    <div id="stage">
      <div id="banner" class="hidden">FEVER!!</div>
      <div id="word"></div>
      <div id="fx"></div>
      <div id="combo"></div>
      <div id="hint">ketik kata-nya &middot; salah nggak apa-apa<br>bar penuh = FEVER: spam SPACE, kata auto kelar</div>
    </div>
    <div id="vn">
      <canvas id="cat" width="32" height="32"></canvas>
      <div id="vnbox">
        <div id="vnname">KOKI</div>
        <div id="vntext"></div>
      </div>
    </div>
    <input id="ghost" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  </div>

  <script src="words.js"></script>
  <script src="config.js"></script>

<script>
'use strict';

const WORDS = window.WORDS;

const wordEl = document.getElementById('word');
const wpmEl = document.getElementById('wpm');
const wordsEl = document.getElementById('words');
const streakEl = document.getElementById('streak');
const bestEl = document.getElementById('best');
const feverFill = document.getElementById('feverfill');
const banner = document.getElementById('banner');
const hint = document.getElementById('hint');
const ghost = document.getElementById('ghost');
const comboEl = document.getElementById('combo');
const dayEl = document.getElementById('day');
const sessionEl = document.getElementById('session');
const graphEl = document.getElementById('wpmGraph');
const gtx = graphEl.getContext('2d');
const catEl = document.getElementById('cat');
const cctx = catEl.getContext('2d');
const vnText = document.getElementById('vntext');
const flashEl = document.getElementById('flash');
const bigEl = document.getElementById('bigfever');

let word = '';
let idx = 0;
let wrongIdx = -1;
let charsTyped = 0;
let totalWords = 0;
let streak = 0;
let best = +(localStorage.getItem('tf_best') || 0);
let samples = [];
let lastWpm = 0;
let dayStreak = 1;
let fever = 0;
let mode = 'normal';
let feverLeft = 0;
let feverTotal = 100;
let startTime = null;
let activeMs = 0;
let lastTick = null;
let feverTimer = null;
let rainTimer = null;
let feverStartWords = 0;

bestEl.textContent = best;

(function dayPass() {
  const key = (d) => d.toISOString().slice(0, 10);
  const todayK = key(new Date());
  const yestK = key(new Date(Date.now() - 864e5));
  const lastDay = localStorage.getItem('tf_last_day') || '';
  dayStreak = +(localStorage.getItem('tf_day_streak') || 0);
  if (lastDay !== todayK) {
    dayStreak = (lastDay === yestK) ? dayStreak + 1 : 1;
    localStorage.setItem('tf_day_streak', dayStreak);
    localStorage.setItem('tf_last_day', todayK);
  }
  dayEl.textContent = dayStreak;
})();

let pool = localStorage.getItem('tf_pool') || 'umum';
if (!WORDS[pool]) pool = 'umum';
const POOL_LABELS = { umum: 'Umum', kafe: 'Kafe', hujan: 'Hujan', alam: 'Alam', kota: 'Kota', malam: 'Malam', tekno: 'Tekno', rumah: 'Rumah', acak: 'Acak' };

function pickWord() {
  const list = WORDS[pool] || WORDS.umum;
  let w;
  do {
    w = list[(Math.random() * list.length) | 0];
  } while (list.length > 1 && w === word);
  return w;
}

function nextWord() {
  word = pickWord();
  idx = 0;
  wrongIdx = -1;
}

function buildPools() {
  const poolsEl = document.getElementById('pools');
  poolsEl.innerHTML = '';
  for (const key of Object.keys(WORDS)) {
    const b = document.createElement('button');
    b.textContent = POOL_LABELS[key] || key;
    b.className = 'poolbtn' + (key === pool ? ' active' : '');
    b.addEventListener('click', () => {
      pool = key;
      localStorage.setItem('tf_pool', key);
      buildPools();
      nextWord();
      render(true);
    });
    poolsEl.appendChild(b);
  }
}

function px(x, y, w, h, c) { cctx.fillStyle = c; cctx.fillRect(x, y, w, h); }

function drawCat(pose) {
  cctx.clearRect(0, 0, 32, 32);
  px(6, 4, 6, 6, '#f0a050'); px(20, 4, 6, 6, '#f0a050');
  px(8, 6, 2, 2, '#e08090'); px(22, 6, 2, 2, '#e08090');
  px(5, 8, 22, 14, '#f0a050');
  px(14, 8, 2, 3, '#d08040'); px(18, 8, 2, 3, '#d08040');
  if (pose === 'sleep') {
    px(10, 15, 4, 1, '#5a3a20'); px(19, 15, 4, 1, '#5a3a20');
  } else if (pose === 'happy') {
    px(10, 15, 1, 2, '#5a3a20'); px(11, 14, 2, 1, '#5a3a20'); px(13, 15, 1, 2, '#5a3a20');
    px(19, 15, 1, 2, '#5a3a20'); px(20, 14, 2, 1, '#5a3a20'); px(22, 15, 1, 2, '#5a3a20');
  } else {
    px(10, 13, 3, 4, '#ffffff'); px(11, 14, 2, 3, '#5a3a20');
    px(19, 13, 3, 4, '#ffffff'); px(20, 14, 2, 3, '#5a3a20');
  }
  px(15, 18, 2, 1, '#e08090');
  px(14, 19, 4, 1, '#5a3a20');
  px(8, 22, 16, 9, '#f0a050');
  px(11, 22, 10, 9, '#e8e8e8');
  px(13, 24, 6, 3, '#b03060');
  px(6, 24, 4, 7, '#f0a050'); px(22, 24, 4, 7, '#f0a050');
  if (pose === 'sleep') {
    cctx.fillStyle = '#8f80b0';
    cctx.font = '8px monospace';
    cctx.fillText('Z', 26, 10);
    cctx.fillText('z', 29, 6);
  }
}

let typeTimer = null;
function say(text, pose) {
  if (typeTimer) { clearInterval(typeTimer); typeTimer = null; }
  if (pose) drawCat(pose);
  vnText.textContent = '';
  let i = 0;
  typeTimer = setInterval(() => {
    i++;
    vnText.textContent = text.slice(0, i);
    if (i >= text.length) { clearInterval(typeTimer); typeTimer = null; }
  }, 24);
}

let idleTimer = null;
function bumpIdle() {
  if (idleTimer) clearTimeout(idleTimer);
  if (mode !== 'fever') drawCat('idle');
  idleTimer = setTimeout(() => { say('ngantuk...?', 'sleep'); }, 15000);
}

function render(newWord, typedIdx = -1) {
  wordEl.classList.toggle('enter', !!newWord);
  wordEl.innerHTML = '';
  word.split('').forEach((ch, i) => {
    const s = document.createElement('span');
    s.textContent = ch;
    s.className = 'ch'
      + (i < idx ? ' done' : '')
      + (i === wrongIdx ? ' wrong' : '')
      + (i === idx && mode === 'normal' ? ' cur' : '')
      + (i === typedIdx ? ' pop' : '');
    if (newWord) s.style.animationDelay = (i * 14) + 'ms';
    wordEl.appendChild(s);
  });
  if (newWord) {
    wordEl.classList.remove('autopop');
    void wordEl.offsetWidth;
    wordEl.classList.add('autopop');
  }
}

function fxCenter() {
  const rect = wordEl.getBoundingClientRect();
  const stageRect = document.getElementById('fx').getBoundingClientRect();
  return { x: rect.left - stageRect.left + rect.width / 2, y: rect.top - stageRect.top + rect.height / 2 };
}

function burst(n, big) {
  const fx = document.getElementById('fx');
  const colors = ['#ffd75e', '#ff9d5c', '#8be08b', '#ff5b8b'];
  const { x, y } = fxCenter();
  for (let i = 0; i < n; i++) {
    const p = document.createElement('span');
    p.className = 'particle';
    const ang = Math.random() * Math.PI * 2;
    const dist = 40 + Math.random() * (big ? 90 : 50);
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    p.style.background = colors[(Math.random() * colors.length) | 0];
    p.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
    p.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
    p.addEventListener('animationend', () => p.remove());
    fx.appendChild(p);
  }
}

function rain() {
  const fx = document.getElementById('fx');
  const p = document.createElement('span');
  p.className = 'particle rain';
  p.style.left = (5 + Math.random() * 90) + '%';
  p.style.top = '0';
  p.style.background = ['#ffd75e', '#ff9d5c', '#8be08b', '#ff5b8b'][(Math.random() * 4) | 0];
  p.addEventListener('animationend', () => p.remove());
  fx.appendChild(p);
}

function floater(text, big) {
  const fx = document.getElementById('fx');
  const { x, y } = fxCenter();
  const f = document.createElement('span');
  f.className = 'floater' + (big ? ' big' : '');
  f.textContent = text;
  f.style.left = (x - (big ? 60 : 12)) + 'px';
  f.style.top = (y - 6) + 'px';
  f.addEventListener('animationend', () => f.remove());
  fx.appendChild(f);
}

function bump(el, val) {
  const v = String(val);
  if (el.textContent === v) return;
  el.textContent = v;
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
  setTimeout(() => el.classList.remove('bump'), 260);
}

function updateStats() {
  if (streak > best) {
    best = streak;
    localStorage.setItem('tf_best', best);
  }
  const now = Date.now();
  if (lastTick && mode === 'normal') activeMs += now - lastTick;
  lastTick = now;
  const mins = activeMs ? Math.max(activeMs / 60000, 1 / 60) : 1 / 60;
  lastWpm = Math.round((charsTyped / 5) / mins);
  bump(wpmEl, lastWpm);
  bump(wordsEl, totalWords);
  bump(streakEl, streak);
  bump(bestEl, best);
  sessionEl.textContent = 'sesi: ' + totalWords + ' kata · ' + Math.floor(activeMs / 60000) + ' mnt';
}

function completeWord(auto) {
  totalWords++;
  streak++;
  if (mode === 'normal') {
    fever = Math.min(tune.fever_max, fever + tune.fever_gain);
    feverFill.style.width = (fever / tune.fever_max * 100) + '%';
    floater('+1');
    if (streak % 10 === 0) { floater('STREAK x' + streak + '!', true); burst(14, true); say('mantap! streak ' + streak + '!', 'happy'); }
    if (fever >= tune.fever_max) startFever();
  } else {
    burst(5);
    comboEl.textContent = 'x' + (totalWords - feverStartWords);
    comboEl.classList.remove('bump');
    void comboEl.offsetWidth;
    comboEl.classList.add('bump');
  }
  updateStats();
  nextWord();
  render(true);
}

function startFever() {
  mode = 'fever';
  feverTotal = tune.fever_max;
  feverLeft = feverTotal;
  document.body.classList.add('fever');
  banner.classList.remove('hidden');
  banner.classList.remove('in');
  void banner.offsetWidth;
  banner.classList.add('in');
  const stage = document.getElementById('stage');
  stage.classList.remove('feverin');
  void stage.offsetWidth;
  stage.classList.add('feverin');
  setTimeout(() => stage.classList.remove('feverin'), 400);
  burst(16, true);
  say('FEVER!! sekejap lagi!', 'happy');
  flashEl.classList.remove('go');
  void flashEl.offsetWidth;
  flashEl.classList.add('go');
  bigEl.classList.remove('go');
  void bigEl.offsetWidth;
  bigEl.classList.add('go');
  const wrap = document.querySelector('.wrap');
  wrap.classList.remove('shake');
  void wrap.offsetWidth;
  wrap.classList.add('shake');
  setTimeout(() => wrap.classList.remove('shake'), 500);
  feverStartWords = totalWords;
  comboEl.textContent = 'x0';
  rainTimer = setInterval(rain, 140);
  hint.innerHTML = 'FEVER MODE!!<br>spam SPACE secepatnya, kata auto kelar';
  feverTimer = setInterval(() => {
    feverLeft -= feverTotal * (100 / tune.fever_drain_ms);
    feverFill.style.width = Math.max(feverLeft / feverTotal * 100, 0) + '%';
    if (feverLeft <= 0) endFever();
  }, 100);
}

function endFever() {
  clearInterval(feverTimer);
  feverTimer = null;
  clearInterval(rainTimer);
  rainTimer = null;
  mode = 'normal';
  fever = 0;
  feverFill.style.width = '0%';
  floater('+' + (totalWords - feverStartWords) + ' kata!', true);
  document.body.classList.remove('fever');
  say('asik... lanjutkan', 'idle');
  banner.classList.add('out');
  setTimeout(() => {
    banner.classList.add('hidden');
    banner.classList.remove('out', 'in');
  }, 260);
  hint.innerHTML = 'ketik kata-nya &middot; salah nggak apa-apa<br>bar penuh = FEVER: spam SPACE, kata auto kelar';
}

document.addEventListener('keydown', (e) => {
  if (e.key === ' ') e.preventDefault();
  bumpIdle();

  if (mode === 'fever') {
    if (e.key === ' ') completeWord(true);
    return;
  }

  if (e.key.length !== 1) return;
  if (!startTime) startTime = Date.now();

  if (e.key.toLowerCase() === word[idx].toLowerCase()) {
    idx++;
    charsTyped++;
    if (idx === word.length) completeWord(false);
    else render(false, idx - 1);
  } else {
    streak = 0;
    wrongIdx = idx;
    const stage = document.getElementById('stage');
    stage.classList.remove('wrongflash');
    void stage.offsetWidth;
    stage.classList.add('wrongflash');
    updateStats();
    render(false);
    setTimeout(() => { wrongIdx = -1; render(false); }, tune.wrong_flash_ms);
  }
});

// mobile: focus hidden input biar keyboard kebuka
function focusGhost() { ghost.focus({ preventScroll: true }); }
document.addEventListener('pointerdown', focusGhost);
window.addEventListener('load', focusGhost);
function drawGraph() {
  const w = graphEl.width, h = graphEl.height;
  gtx.clearRect(0, 0, w, h);
  gtx.fillStyle = '#2e2444';
  for (let y = 0; y < h; y += 6) gtx.fillRect(0, y, w, 1);
  if (samples.length < 2) return;
  const max = Math.max(40, ...samples);
  const step = w / (samples.length - 1);
  gtx.fillStyle = 'rgba(255,215,94,.15)';
  gtx.beginPath();
  gtx.moveTo(0, h);
  samples.forEach((s, i) => gtx.lineTo(i * step, h - (s / max) * (h - 4)));
  gtx.lineTo((samples.length - 1) * step, h);
  gtx.fill();
  gtx.strokeStyle = '#ffd75e';
  gtx.lineWidth = 1;
  gtx.beginPath();
  samples.forEach((s, i) => {
    const x = i * step, y = h - (s / max) * (h - 4);
    i ? gtx.lineTo(x, y) : gtx.moveTo(x, y);
  });
  gtx.stroke();
  const lx = (samples.length - 1) * step;
  const ly = h - (samples[samples.length - 1] / max) * (h - 4);
  gtx.fillStyle = '#8be08b';
  gtx.fillRect(lx - 1, ly - 1, 3, 3);
}

setInterval(() => {
  if (startTime && mode === 'normal' && lastWpm > 0) {
    samples.push(lastWpm);
    if (samples.length > 90) samples.shift();
    drawGraph();
  }
  updateStats();
}, 1000);

const hourNow = new Date().getHours();
const scene = hourNow < 5 ? 'malam' : hourNow < 11 ? 'pagi' : hourNow < 15 ? 'siang' : hourNow < 19 ? 'senja' : 'malam';
document.body.classList.add('scene-' + scene);
buildPools();
nextWord();
render(true);
say('selamat ' + scene + '! ketik kata-nya, pelan-pelan saja', 'idle');
bumpIdle();
</script>
